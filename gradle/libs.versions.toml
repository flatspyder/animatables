[versions]
agp = "9.5.0"
kotlin = "2.4.21"
compose = "1.12.1"
material3 = "1.5.0-beta02"
multiplatform = "1.12.2"
multiplatformMaterial3 = "1.12.0-alpha03"
activity = "1.13.0"

[libraries]
multiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "multiplatform" }
multiplatform-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "multiplatform" }
multiplatform-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "multiplatform" }
multiplatform-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "multiplatformMaterial3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "multiplatform" }
